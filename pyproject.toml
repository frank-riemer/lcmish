[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lcmish"
version = "0.3.1"
description = "Transparent linear-combination modelling for MR spectroscopy"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [
  {name = "Frank Riemer"}
]
keywords = ["MRS", "magnetic resonance spectroscopy", "spectroscopy", "linear combination modelling", "31P", "LCModel"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "numpy>=1.23",
  "scipy>=1.9",
  "matplotlib>=3.6",
]

[project.optional-dependencies]
nifti = ["nibabel>=5.2"]
twix = ["pymapvbvd>=0.6"]
dicom = ["pydicom>=2.4"]
siemens = ["pymapvbvd>=0.6", "pydicom>=2.4"]
all = ["nibabel>=5.2", "pymapvbvd>=0.6", "pydicom>=2.4"]
test = ["pytest>=7"]
dev = ["pytest>=7", "build>=1.2"]

[project.scripts]
lcmish = "lcmish.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lcmish = ["data/*.BASIS", "data/*.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
